name = "steg-mm-verifier"
main = "worker/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

# Public config (non-secret).
[vars]
# Verifier: Universal Resolver (read-side) + Tier-1 fleet envelope name.
ENS_UNIVERSAL_RESOLVER = "0xeEeEEEeE14D718C2B47D9923Deab1335E144EeEe"
STEG_FLEET_NAME = "steg.eth"

# KV for the ENS commit/reveal register flow (ens-agent-api routes).
# Local `wrangler dev` simulates this; for deploy, create one and paste the id:
#   bunx wrangler kv namespace create ENS_SESSIONS
[[kv_namespaces]]
binding = "ENS_SESSIONS"
id = "1f9c219cb6e04a10a7c02a6fbd9d64c0"

# Secrets (NOT in this file). Set via `wrangler secret put <NAME>`; for local
# `wrangler dev`, put them in .dev.vars (gitignored):
#   ETH_RPC_URL_MAINNET   mainnet RPC (verifier + mainnet ENS reads)
#   ETH_RPC_URL_SEPOLIA   sepolia RPC (ens-agent-api default network)
#   API_KEY               bearer key gating the POST write routes (NOT /evaluate)
